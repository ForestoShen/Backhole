<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Hole — Gravitational Lensing</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { overflow: hidden; background: #000; height: 100%; }
canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
canvas:active { cursor: grabbing; }
#info {
  position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.45); font: 12px/1.6 ui-monospace, monospace;
  pointer-events: none; user-select: none; white-space: nowrap;
  text-shadow: 0 1px 3px #000;
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="info">滚轮 缩放 · 左键拖拽 旋转视角 · 右键拖拽 平移</div>

<script>
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { antialias: false });
if (!gl) { document.body.innerHTML = '<p style="color:#fff;padding:2em">需要 WebGL2 支持</p>'; throw new Error('No WebGL2'); }

// ============================ SHADERS ============================
const vertSrc = `#version 300 es
void main() {
  vec2 v = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(v * 2.0 - 1.0, 0.0, 1.0);
}`;

const fragSrc = `#version 300 es
precision highp float;

uniform vec2  u_res;
uniform float u_time;
uniform vec2  u_offset;   // pan
uniform float u_zoom;     // view distance factor
uniform vec2  u_orbit;    // x = polar (from +Y), y = azimuth

out vec4 fragColor;

// ---- physical constants (declared before any use) ----
const float RS   = 0.5;   // Schwarzschild (event horizon) radius
const float GM   = 0.25;  // = RS/2
const float DISK_IN  = 1.5;  // inner edge = ISCO = 3 RS
const float DISK_OUT = 4.5;  // outer edge
const float BASE_DIST = 5.0; // default camera distance

// ---- hashing / noise ----
float hash12(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float hash13(vec3 p3) {
  p3 = fract(p3 * 0.1031);
  p3 += dot(p3, p3.zyx + 31.32);
  return fract((p3.x + p3.y) * p3.z);
}
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash12(i);
  float b = hash12(i + vec2(1.0, 0.0));
  float c = hash12(i + vec2(0.0, 1.0));
  float d = hash12(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
  for (int i = 0; i < 5; i++) {
    v += a * vnoise(p);
    p = rot * p * 2.03;
    a *= 0.5;
  }
  return v;
}

// ---- background: star field + faint nebula ----
vec3 starField(vec3 dir) {
  vec3 col = vec3(0.0);
  for (int layer = 0; layer < 3; layer++) {
    float fl = float(layer);
    float scale = 60.0 + fl * 90.0;
    vec3 p = dir * scale;
    vec3 id = floor(p);
    vec3 f = fract(p) - 0.5;
    float h = hash13(id);
    float thr = 0.996 - fl * 0.0015;
    if (h > thr) {
      float b = (h - thr) / (1.0 - thr);
      b = b * b * (2.0 + fl * 1.0);
      float temp = hash13(id + 7.7);
      vec3 sc;
      if      (temp < 0.30) sc = vec3(0.65, 0.75, 1.0);
      else if (temp < 0.60) sc = vec3(1.0, 0.97, 0.9);
      else if (temp < 0.85) sc = vec3(1.0, 0.85, 0.6);
      else                  sc = vec3(1.0, 0.62, 0.45);
      col += sc * b * exp(-dot(f, f) * 90.0);
    }
  }
  // faint nebula / galactic dust
  float n = fbm(dir.xy * 3.0 + 11.0) * fbm(dir.zy * 4.0 - 4.0);
  col += mix(vec3(0.015, 0.010, 0.035), vec3(0.04, 0.012, 0.02), n) * 0.5;
  return col;
}

// ---- accretion disk emission ----
vec3 diskColor(vec3 p, float r, vec3 camPos) {
  float t = (r - DISK_IN) / (DISK_OUT - DISK_IN); // 0 inner -> 1 outer
  if (t < 0.0 || t > 1.0) return vec3(0.0);

  // temperature: white-hot inner -> orange -> dark red outer
  vec3 white  = vec3(1.0, 0.98, 0.90);
  vec3 orange = vec3(1.0, 0.55, 0.12);
  vec3 red    = vec3(0.45, 0.08, 0.0);
  vec3 col;
  if (t < 0.25) col = mix(white, orange, t / 0.25);
  else          col = mix(orange, red, (t - 0.25) / 0.75);

  // radial intensity falloff
  float intensity = pow(1.0 - t, 2.0) * 4.5 + 0.25;

  // swirling turbulence (differential rotation)
  float ang = atan(p.z, p.x);
  float swirl = ang + (1.0 - r) * 2.0 - u_time * (0.4 + 1.5 / r);
  float turb = fbm(vec2(swirl * 2.0, r * 4.0));
  intensity *= 0.65 + 0.7 * turb;

  // relativistic Doppler beaming: approaching side brighter
  float vkep = sqrt(GM / r);                 // Keplerian speed
  vec3 vdir = vec3(-p.z, 0.0, p.x) / r;      // orbital tangent
  vec3 v = vdir * vkep;
  vec3 toCam = normalize(camPos - p);
  float gamma = 1.0 / sqrt(max(1.0 - dot(v, v), 1e-4));
  float delta = 1.0 / (gamma * (1.0 - dot(v, toCam)));
  intensity *= delta * delta * delta;
  col *= 0.85 + 0.3 * delta;                 // slight color shift

  return col * intensity;
}

// ---- ray trace with gravitational lensing ----
vec3 traceRay(vec3 ro, vec3 rd) {
  vec3 pos = ro;
  vec3 vel = rd;
  vec3 prevPos = ro;
  float t = 0.0;

  for (int i = 0; i < 450; i++) {
    float r2 = dot(pos, pos);
    float r = sqrt(r2);

    // captured by the event horizon
    if (r < RS) return vec3(0.0);
    // escaped to infinity
    if (r > 14.0) break;

    // adaptive step: finer near the hole
    float dt = clamp(0.012 * r, 0.002, 0.06);

    // Schwarzschild-like bending (photon sphere at 1.5 RS)
    vec3 accel = -pos * (1.5 * RS) / (r2 * r2 * r);
    vel += accel * dt;
    vel = normalize(vel); // keep null speed ~ 1

    prevPos = pos;
    pos += vel * dt;
    t += dt;

    // accretion-disk plane crossing (y = 0)
    if (prevPos.y * pos.y < 0.0) {
      float f = prevPos.y / (prevPos.y - pos.y);
      vec3 cp = mix(prevPos, pos, f);
      float cr = length(cp.xz);
      if (cr > DISK_IN && cr < DISK_OUT) {
        return diskColor(cp, cr, ro);
      }
    }
  }
  return starField(normalize(vel));
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / u_res.y;
  uv = uv / u_zoom + u_offset;

  // camera on a spherical orbit around the hole
  float dist  = BASE_DIST / u_zoom;
  float theta = u_orbit.x;
  float phi   = u_orbit.y;
  vec3 ro = dist * vec3(sin(theta) * sin(phi), cos(theta), sin(theta) * cos(phi));
  vec3 fwd = normalize(-ro);
  vec3 up  = vec3(0.0, 1.0, 0.0);
  vec3 right = normalize(cross(fwd, up));
  vec3 up2 = cross(right, fwd);
  vec3 rd = normalize(fwd + uv.x * right + uv.y * up2);

  vec3 col = traceRay(ro, rd);

  // tone map + gamma
  col = col / (col + 1.0);
  col = pow(col, vec3(0.85));

  // dither to break up gradient banding
  col += (hash12(gl_FragCoord.xy + fract(u_time) * 61.7) - 0.5) * (2.0 / 255.0);

  // vignette
  vec2 vuv = gl_FragCoord.xy / u_res;
  float vig = 1.0 - 0.4 * dot(vuv - 0.5, vuv - 0.5) * 2.0;
  col *= clamp(vig, 0.0, 1.0);

  fragColor = vec4(col, 1.0);
}`;

// ============================ GL SETUP ============================
function compileShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error('Shader error:\n' + gl.getShaderInfoLog(s));
    throw new Error('Shader compile error');
  }
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compileShader(gl.VERTEX_SHADER, vertSrc));
gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, fragSrc));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
  console.error('Link error:\n' + gl.getProgramInfoLog(prog));
  throw new Error('Link error');
}
gl.useProgram(prog);

const uRes     = gl.getUniformLocation(prog, 'u_res');
const uTime    = gl.getUniformLocation(prog, 'u_time');
const uOffset  = gl.getUniformLocation(prog, 'u_offset');
const uZoom    = gl.getUniformLocation(prog, 'u_zoom');
const uOrbit   = gl.getUniformLocation(prog, 'u_orbit');

// ============================ STATE ============================
let offsetX = 0, offsetY = 0;
let zoom = 1.0;
let theta = 1.15;   // polar (from +Y)
let phi   = 0.0;    // azimuth
let dragging = false;
let dragMode = 0;   // 0 = rotate (left), 1 = pan (right)
let lastX = 0, lastY = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(window.innerWidth  * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

// ============================ INPUT ============================
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const f = e.deltaY > 0 ? 0.9 : 1.1;
  zoom = Math.max(0.4, Math.min(2.6, zoom * f));
}, { passive: false });

canvas.addEventListener('mousedown', (e) => {
  dragging = true;
  dragMode = (e.button === 2) ? 1 : 0;
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const dx = (e.clientX - lastX) / window.innerWidth;
  const dy = (e.clientY - lastY) / window.innerHeight;
  lastX = e.clientX; lastY = e.clientY;
  if (dragMode === 0) {
    // orbit
    phi   += dx * 4.0;
    theta += dy * 4.0;
    theta = Math.max(0.15, Math.min(Math.PI - 0.15, theta));
  } else {
    // pan
    offsetX += dx * 2.0 / zoom;
    offsetY -= dy * 2.0 / zoom;
  }
});
window.addEventListener('mouseup', () => { dragging = false; });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

// touch: single finger orbit, pinch zoom
let touchDist = 0;
canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    dragging = true; dragMode = 0;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    dragging = false;
    touchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                           e.touches[0].clientY - e.touches[1].clientY);
  }
}, { passive: true });
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (e.touches.length === 1 && dragging) {
    const dx = (e.touches[0].clientX - lastX) / window.innerWidth;
    const dy = (e.touches[0].clientY - lastY) / window.innerHeight;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    phi += dx * 4.0; theta += dy * 4.0;
    theta = Math.max(0.15, Math.min(Math.PI - 0.15, theta));
  } else if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                         e.touches[0].clientY - e.touches[1].clientY);
    if (touchDist > 0) zoom = Math.max(0.4, Math.min(2.6, zoom * (d / touchDist)));
    touchDist = d;
  }
}, { passive: false });
canvas.addEventListener('touchend', () => { dragging = false; touchDist = 0; });

// ============================ RENDER LOOP ============================
function render(time) {
  const t = time * 0.001;
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, t);
  gl.uniform2f(uOffset, offsetX, offsetY);
  gl.uniform1f(uZoom, zoom);
  gl.uniform2f(uOrbit, theta, phi);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
